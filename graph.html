<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT VisualGraph PRO</title>
    <!-- Подключение шрифтов и библиотек -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" href="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --connect-mode-color: #10b981;
            --connect-mode-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger-color: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Полоса прокрутки */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Главный контейнер графа */
        #network-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(to right, rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 40px 40px, 40px 40px, 40px 40px;
            transition: var(--transition-smooth);
        }

        #network-container.connecting-active {
            box-shadow: inset 0 0 40px var(--connect-mode-glow);
        }

        /* Общие стили стеклянных панелей (Glassmorphism) */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            position: absolute;
            transition: var(--transition-smooth);
        }

        /* Кнопка триггер верхнего меню */
        .menu-toggle-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            padding: 10px 24px;
            border-radius: 30px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }
        .menu-toggle-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
            background: rgba(17, 24, 39, 0.95);
        }
        .menu-toggle-btn i {
            transition: var(--transition-smooth);
        }
        .menu-toggle-btn.panel-closed i {
            transform: rotate(-180deg);
        }

        /* Верхняя панель управления */
        .top-panel {
            top: 75px;
            left: 50%;
            transform: translateX(-50%) scale(1);
            width: 90%;
            max-width: 950px;
            padding: 18px 24px;
            opacity: 1;
            pointer-events: auto;
            transform-origin: top center;
        }

        .top-panel.hidden {
            top: 40px;
            transform: translateX(-50%) scale(0.95);
            opacity: 0;
            pointer-events: none;
        }

        .panel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Поля ввода и элементы управления */
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        .main-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 10px 14px 10px 36px;
            font-size: 13px;
            outline: none;
            width: 190px;
            transition: var(--transition-smooth);
        }
        .main-input:focus {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        /* Стили выпадающих списков и палитры */
        .custom-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .custom-select:focus {
            border-color: var(--accent-color);
        }
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .color-picker-wrapper label {
            font-size: 11px;
            color: var(--text-muted);
        }
        .color-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .color-input::-webkit-color-swatch {
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* Кнопки */
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }
        .btn:hover {
            box-shadow: 0 0 12px var(--accent-glow);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none;
            border-color: rgba(255,255,255,0.2);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* Панель поиска (слева сверху) */
        .search-box {
            top: 20px;
            left: 20px;
            padding: 6px;
            border-radius: var(--radius-md);
        }
        .search-box .main-input {
            width: 220px;
        }

        /* Нижний инструмент соединения */
        .bottom-panel {
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .connect-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-smooth);
        }
        .connect-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255,255,255,0.3);
        }
        .connect-toggle-btn.active {
            background: var(--connect-mode-color);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px var(--connect-mode-glow);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .stats-counter {
            font-size: 12px;
            color: var(--text-muted);
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 12px;
            margin-left: 4px;
            white-space: nowrap;
        }

        /* Правая боковая панель инспектора свойств */
        .inspector-panel {
            top: 20px;
            right: -340px;
            width: 320px;
            height: calc(100vh - 40px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .inspector-panel.open {
            right: 20px;
        }
        .inspector-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 12px;
        }
        .inspector-header h3 {
            font-size: 16px;
            font-weight: 600;
        }
        .close-inspector {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition-smooth);
        }
        .close-inspector:hover {
            color: var(--text-main);
        }
        .inspector-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .inspector-section label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .inspector-section .main-input, .inspector-section .custom-select {
            width: 100%;
        }

        /* Системные Toasts уведомления */
        .toast-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: rgba(17, 24, 39, 0.9);
            border-left: 4px solid var(--accent-color);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 4px var(--radius-md) var(--radius-md) 4px;
            color: var(--text-main);
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(120%);
            transition: var(--transition-smooth);
            pointer-events: auto;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.toast-success { border-left-color: var(--connect-mode-color); }
        .toast.toast-danger { border-left-color: var(--danger-color); }

        /* Вспомогательный скрытый инпут импорта */
        #import-file-input {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Кнопка скрытия/раскрытия меню -->
    <button class="menu-toggle-btn" id="menuToggle"><i class="fa-solid fa-gear"></i><span>Управление</span></button>

    <!-- Верхнее меню управления -->
    <div class="glass-panel top-panel" id="topPanel">
        <div class="panel-row">
            <!-- Блок создания элементов -->
            <div class="control-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-font"></i>
                    <input type="text" id="nodeLabel" class="main-input" placeholder="Имя / Значение">
                </div>
                <select id="nodeType" class="custom-select">
                    <option value="user">👤 Персона</option>
                    <option value="envelope">✉️ Email</option>
                    <option value="phone">📞 Телефон</option>
                    <option value="globe">🌐 Домен / IP</option>
                    <option value="building">🏢 Организация</option>
                </select>
                <div class="color-picker-wrapper">
                    <label for="nodeColor">Цвет:</label>
                    <input type="color" id="nodeColor" class="color-input" value="#3b82f6">
                </div>
                <button class="btn" id="addNodeBtn"><i class="fa-solid fa-plus"></i> Создать</button>
            </div>

            <!-- Блок экспорта/импорта -->
            <div class="control-group">
                <button class="btn btn-secondary" id="exportImgBtn"><i class="fa-solid fa-image"></i> Фото (PNG)</button>
                <button class="btn btn-secondary" id="exportJsonBtn"><i class="fa-solid fa-file-export"></i> Экспорт JSON</button>
                <button class="btn btn-secondary" id="importJsonBtn"><i class="fa-solid fa-file-import"></i> Импорт</button>
                <input type="file" id="import-file-input" accept=".json">
            </div>
        </div>
    </div>

    <!-- Умный поиск слева сверху -->
    <div class="glass-panel search-box">
        <div class="input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchBar" class="main-input" placeholder="Быстрый поиск по графу...">
        </div>
    </div>

    <!-- Главная рабочая область сети графа -->
    <div id="network-container"></div>

    <!-- Нижняя панель с инструментом соединения -->
    <div class="glass-panel bottom-panel">
        <button class="connect-toggle-btn" id="connectModeToggle">
            <i class="fa-solid fa-link"></i> Режим соединения
        </button>
        <div class="stats-counter" id="statsCounter">Узлы: 0 | Связи: 0</div>
    </div>

    <!-- Боковая панель параметров (Инспектор свойств) -->
    <div class="glass-panel inspector-panel" id="inspectorPanel">
        <div class="inspector-header">
            <h3 id="inspectorTitle">Свойства объекта</h3>
            <button class="close-inspector" id="closeInspector"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <!-- Параметры для узла -->
        <div id="inspectorNodeContent" style="display: none;" class="inspector-section">
            <div class="inspector-section">
                <label>Текст подписи</label>
                <input type="text" id="editNodeLabel" class="main-input">
            </div>
            <div class="inspector-section" style="margin-top: 10px;">
                <label>Размер шрифта</label>
                <select id="editNodeFontSize" class="custom-select">
                    <option value="12">Маленький (12px)</option>
                    <option value="15">Стандартный (15px)</option>
                    <option value="18">Крупный (18px)</option>
                    <option value="24">Огромный (24px)</option>
                </select>
            </div>
        </div>

        <!-- Параметры для связи (ребра) -->
        <div id="inspectorEdgeContent" style="display: none;" class="inspector-section">
            <div class="inspector-section">
                <label>Текст связи (например: Владелец)</label>
                <input type="text" id="editEdgeLabel" class="main-input" placeholder="Опишите тип связи...">
            </div>
            <div class="inspector-section" style="margin-top: 10px;">
                <label>Стиль линии связи</label>
                <select id="editEdgeStyle" class="custom-select">
                    <option value="solid">Сплошная линия</option>
                    <option value="dashed">Пунктир</option>
                </select>
            </div>
        </div>

        <!-- Кнопка удаления в инспекторе -->
        <div style="margin-top: auto;">
            <button class="btn btn-danger" style="width: 100%; justify-content: center;" id="deleteElementBtn">
                <i class="fa-solid fa-trash-can"></i> Удалить элемент
            </button>
        </div>
    </div>

    <!-- Контейнер для всплывающих уведомлений -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Логика приложения -->
    <script>
        // Инициализация структур данных Vis.js
        let nodes = new vis.DataSet([]);
        let edges = new vis.DataSet([]);
        let network = null;

        // Переменные состояния приложения
        let isConnectMode = false;
        let connectFirstNodeId = null;
        let selectedNodeId = null;
        let selectedEdgeId = null;

        // Маппинг иконок FontAwesome к сущностям
        const iconMapping = {
            'user': '',
            'envelope': '',
            'phone': '',
            'globe': '',
            'building': ''
        };

        // DOM элементы
        const container = document.getElementById('network-container');
        const menuToggle = document.getElementById('menuToggle');
        const topPanel = document.getElementById('topPanel');
        const connectModeToggle = document.getElementById('connectModeToggle');
        const statsCounter = document.getElementById('statsCounter');
        const searchBar = document.getElementById('searchBar');
        
        // Элементы инспектора
        const inspectorPanel = document.getElementById('inspectorPanel');
        const closeInspector = document.getElementById('closeInspector');
        const inspectorTitle = document.getElementById('inspectorTitle');
        const inspectorNodeContent = document.getElementById('inspectorNodeContent');
        const inspectorEdgeContent = document.getElementById('inspectorEdgeContent');
        const editNodeLabel = document.getElementById('editNodeLabel');
        const editNodeFontSize = document.getElementById('editNodeFontSize');
        const editEdgeLabel = document.getElementById('editEdgeLabel');
        const editEdgeStyle = document.getElementById('editEdgeStyle');
        const deleteElementBtn = document.getElementById('deleteElementBtn');

        // Утилита вывода плавных уведомлений (Toast)
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            let icon = '<i class="fa-solid fa-circle-check"></i>';
            if(type === 'danger') icon = '<i class="fa-solid fa-circle-exclamation"></i>';
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Обновление живой статистики графа
        function updateStats() {
            statsCounter.innerText = `Узлы: ${nodes.length} | Связи: ${edges.length}`;
        }

        // Плавное открытие/закрытие верхнего меню управления
        menuToggle.addEventListener('click', () => {
            topPanel.classList.toggle('hidden');
            menuToggle.classList.toggle('panel-closed');
        });

        // Создание графа и конфигурация физики Vis.js
        function initNetwork() {
            const data = { nodes: nodes, edges: edges };
            const options = {
                nodes: {
                    shape: 'icon',
                    icon: {
                        face: '"Font Awesome 6 Free"',
                        weight: '900',
                        size: 38,
                        color: '#3b82f6'
                    },
                    font: {
                        color: '#f3f4f6',
                        size: 15,
                        vadjust: 10,
                        face: 'Inter'
                    },
                    shadow: { enabled: true, color: 'rgba(0,0,0,0.4)', size: 6 }
                },
                edges: {
                    arrows: { to: { enabled: true, scaleFactor: 0.8 } },
                    color: { color: 'rgba(255, 255, 255, 0.25)', highlight: '#3b82f6', hover: 'rgba(255, 255, 255, 0.4)' },
                    font: { color: '#9ca3af', size: 12, background: '#0b0f19', strokeWidth: 0, face: 'Inter', align: 'horizontal' },
                    width: 2,
                    smooth: { type: 'cubicBezier', roundness: 0.4 }
                },
                interaction: {
                    hover: true,
                    multiselect: false,
                    navigationButtons: false
                },
                physics: {
                    enabled: true,
                    barnesHut: {
                        gravitationalConstant: -2500,
                        centralGravity: 0.2,
                        springLength: 120,
                        springConstant: 0.04
                    },
                    stabilization: { iterations: 150, updateInterval: 25 }
                }
            };

            network = new vis.Network(container, data, options);

            // Обработка кликов на холсте графа
            network.on('click', function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    handleNodeClick(nodeId);
                } else if (params.edges.length > 0) {
                    const edgeId = params.edges[0];
                    handleEdgeClick(edgeId);
                } else {
                    resetSelection();
                }
            });
            
            nodes.on('*', updateStats);
            edges.on('*', updateStats);
            updateStats();
        }

        // Логика клика по узлу
        function handleNodeClick(nodeId) {
            if (isConnectMode) {
                if (!connectFirstNodeId) {
                    // Выбран первый узел для связи
                    connectFirstNodeId = nodeId;
                    showToast('Первый объект выбран. Теперь кликните по второму', 'success');
                    nodes.update({id: nodeId, shadow: {enabled: true, color: '#10b981', size: 15}});
                } else {
                    // Выбран второй узел — создаем связь
                    if (connectFirstNodeId !== nodeId) {
                        // Проверка на дубликат связи
                        const existingEdges = edges.get({
                            filter: function(item) {
                                return item.from === connectFirstNodeId && item.to === nodeId;
                            }
                        });
                        
                        if (existingEdges.length === 0) {
                            edges.add({
                                from: connectFirstNodeId,
                                to: nodeId,
                                label: ''
                            });
                            showToast('Связь успешно установлена');
                        } else {
                            showToast('Такая связь уже существует', 'danger');
                        }
                    }
                    // Автовыход из режима соединения для удобства UX
                    exitConnectMode();
                }
            } else {
                // Обычный режим - открываем инспектор параметров узла
                selectedNodeId = nodeId;
                selectedEdgeId = null;
                
                const nodeData = nodes.get(nodeId);
                inspectorTitle.innerText = "Параметры объекта";
                editNodeLabel.value = nodeData.label || '';
                editNodeFontSize.value = nodeData.font?.size || 15;
                
                inspectorNodeContent.style.display = 'block';
                inspectorEdgeContent.style.display = 'none';
                inspectorPanel.classList.add('open');
            }
        }

        // Логика клика по ребру (линии связи)
        function handleEdgeClick(edgeId) {
            if (isConnectMode) return;
            
            selectedEdgeId = edgeId;
            selectedNodeId = null;
            
            const edgeData = edges.get(edgeId);
            inspectorTitle.innerText = "Параметры связи";
            editEdgeLabel.value = edgeData.label || '';
            editEdgeStyle.value = (edgeData.dashed) ? 'dashed' : 'solid';
            
            inspectorNodeContent.style.display = 'none';
            inspectorEdgeContent.style.display = 'block';
            inspectorPanel.classList.add('open');
        }

        // Закрытие панелей и сброс фокуса
        function resetSelection() {
            if (connectFirstNodeId) {
                const firstNode = nodes.get(connectFirstNodeId);
                if (firstNode) nodes.update({id: connectFirstNodeId, shadow: {enabled: true, color: 'rgba(0,0,0,0.4)', size: 6}});
            }
            selectedNodeId = null;
            selectedEdgeId = null;
            inspectorPanel.classList.remove('open');
        }

        // Переключение режима соединения внизу
        connectModeToggle.addEventListener('click', () => {
            if (!isConnectMode) {
                isConnectMode = true;
                connectModeToggle.classList.add('active');
                container.classList.add('connecting-active');
                connectFirstNodeId = null;
                resetSelection();
                showToast('Включен режим связывания. Выберите начальный узел', 'success');
            } else {
                exitConnectMode();
            }
        });

        function exitConnectMode() {
            isConnectMode = false;
            connectModeToggle.classList.remove('active');
            container.classList.remove('connecting-active');
            if (connectFirstNodeId) {
                const firstNode = nodes.get(connectFirstNodeId);
                if (firstNode) nodes.update({id: connectFirstNodeId, shadow: {enabled: true, color: 'rgba(0,0,0,0.4)', size: 6}});
            }
            connectFirstNodeId = null;
        }

        // Добавление нового узла из верхнего меню
        document.getElementById('addNodeBtn').addEventListener('click', () => {
            const labelInput = document.getElementById('nodeLabel').value.trim();
            const type = document.getElementById('nodeType').value;
            const color = document.getElementById('nodeColor').value;

            if (!labelInput) {
                showToast('Пожалуйста, введите имя или текст объекта', 'danger');
                return;
            }

            const uniqueId = 'node_' + Date.now();
            nodes.add({
                id: uniqueId,
                label: labelInput,
                icon: {
                    code: iconMapping[type] || '',
                    color: color
                }
            });

            document.getElementById('nodeLabel').value = '';
            showToast('Объект успешно создан');
        });

        // Редактирование параметров в инспекторе в реальном времени
        editNodeLabel.addEventListener('input', () => {
            if (selectedNodeId) {
                nodes.update({ id: selectedNodeId, label: editNodeLabel.value });
            }
        });

        editNodeFontSize.addEventListener('change', () => {
            if (selectedNodeId) {
                nodes.update({ id: selectedNodeId, font: { size: parseInt(editNodeFontSize.value) } });
            }
        });

        editEdgeLabel.addEventListener('input', () => {
            if (selectedEdgeId) {
                edges.update({ id: selectedEdgeId, label: editEdgeLabel.value });
            }
        });

        editEdgeStyle.addEventListener('change', () => {
            if (selectedEdgeId) {
                const isDashed = editEdgeStyle.value === 'dashed';
                edges.update({ id: selectedEdgeId, dashed: isDashed });
            }
        });

        // Удаление элемента (Кнопка в инспекторе или Горячие клавиши)
        function deleteSelectedElement() {
            if (selectedNodeId) {
                nodes.remove(selectedNodeId);
                // Удаляем также связанные ребра автоматически
                const connectedEdges = edges.get({
                    filter: function (item) { return item.from === selectedNodeId || item.to === selectedNodeId; }
                });
                edges.remove(connectedEdges);
                showToast('Объект удален', 'danger');
                resetSelection();
            } else if (selectedEdgeId) {
                edges.remove(selectedEdgeId);
                showToast('Связь удалена', 'danger');
                resetSelection();
            }
        }

        deleteElementBtn.addEventListener('click', deleteSelectedElement);
        closeInspector.addEventListener('click', resetSelection);

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && 
                document.activeElement.tagName !== 'INPUT' && 
                document.activeElement.tagName !== 'SELECT') {
                deleteSelectedElement();
            }
        });

        // Живой поиск с эффектом размытия и фильтрации фокуса
        searchBar.addEventListener('input', () => {
            const query = searchBar.value.toLowerCase().trim();
            const allNodes = nodes.get();

            if (query === "") {
                // Сброс фильтрации
                allNodes.forEach(node => {
                    nodes.update({ id: node.id, opacity: 1, font: { color: '#f3f4f6' } });
                });
                return;
            }

            allNodes.forEach(node => {
                const match = node.label && node.label.toLowerCase().includes(query);
                if (match) {
                    nodes.update({ id: node.id, opacity: 1, font: { color: '#f3f4f6' } });
                } else {
                    // Плавное приглушение неподходящих элементов
                    nodes.update({ id: node.id, opacity: 0.15, font: { color: 'rgba(243,244,246,0.15)' } });
                }
            });
        });

        // Экспорт графа в структуру JSON
        document.getElementById('exportJsonBtn').addEventListener('click', () => {
            const graphData = {
                nodes: nodes.get(),
                edges: edges.get()
            };
            const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(graphData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", jsonString);
            downloadAnchor.setAttribute("download", `osint_graph_export_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Структура графа экспортирована в файл JSON');
        });

        // Импорт сохраненной схемы из JSON-файла
        const importBtn = document.getElementById('importJsonBtn');
        const fileInput = document.getElementById('import-file-input');

        importBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsedData = JSON.parse(event.target.result);
                    if (parsedData.nodes && parsedData.edges) {
                        nodes.clear();
                        edges.clear();
                        nodes.add(parsedData.nodes);
                        edges.add(parsedData.edges);
                        network.fit(); // Авто-подгон масштаба под импортированный граф
                        showToast('Граф связей успешно восстановлен из файла', 'success');
                    } else {
                        showToast('Неверный формат файла данных', 'danger');
                    }
                } catch (err) {
                    showToast('Ошибка при чтения JSON-файла', 'danger');
                }
            };
            reader.readAsText(file);
            fileInput.value = ''; // Сброс инпута
        });

        // Продвинутый экспорт холста Canvas в Фото (PNG) высокого разрешения
        document.getElementById('exportImgBtn').addEventListener('click', () => {
            if (!network) return;
            
            // Фиксируем холст Vis.js
            const canvas = container.getElementsByTagName('canvas')[0];
            if (!canvas) {
                showToast('Ошибка экспорта изображения', 'danger');
                return;
            }

            showToast('Генерация фотоснимка высокого разрешения...');

            // Создаем временный виртуальный холст для добавления фирменной подложки и сетки
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const ctx = exportCanvas.getContext('2d');

            // 1. Отрисовка темного фона
            ctx.fillStyle = "#0b0f19";
            ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // 2. Нанесение сетки на снимок
            ctx.strokeStyle = "rgba(255, 255, 255, 0.015)";
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < exportCanvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, exportCanvas.height); ctx.stroke();
            }
            for (let y = 0; y < exportCanvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(exportCanvas.width, y); ctx.stroke();
            }

            // 3. Накладываем саму сеть объектов поверх фона
            ctx.drawImage(canvas, 0, 0);

            // Скачивание итогового файла картинки
            const imageURL = exportCanvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = `osint_graph_capture_${Date.now()}.png`;
            link.href = imageURL;
            document.body.appendChild(link);
            link.click();
            document.body.remove();
            showToast('Фотография графа успешно сохранена', 'success');
        });

        // Старт приложения при загрузке страницы
        window.addEventListener('load', () => {
            initNetwork();
            
            // Создание дефолтных демонстрационных узлов
            nodes.add([
                { id: 'n1', label: 'Иванов А.В.', icon: { code: iconMapping['user'], color: '#ef4444' } },
                { id: 'n2', label: 'ivanov@email.com', icon: { code: iconMapping['envelope'], color: '#f59e0b' } },
                { id: 'n3', label: '+7 (999) 123-45-67', icon: { code: iconMapping['phone'], color: '#10b981' } }
            ]);
            edges.add([
                { from: 'n1', to: 'n2', label: 'основной' },
                { from: 'n1', to: 'n3', label: 'контактный' }
            ]);
            
            if(network) network.fit();
        });
    </script>
</body>
</html>
