<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsintGraph - Визуализатор</title>
    <!-- Подключаем Vis.js для работы с графами -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <!-- Подключаем FontAwesome для OSINT иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
        }
        /* Сетка как на скриншоте OsintGraph */
        #network-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px), 
                radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            z-index: 1;
        }
        /* Верхнее меню */
        .top-menu-wrapper {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 90%;
            max-width: 800px;
        }
        .toggle-menu-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-menu-btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        .top-menu {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.4s ease;
            max-height: 500px;
            opacity: 1;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        .top-menu.hidden {
            max-height: 0;
            opacity: 0;
            padding: 0 15px;
            border-color: transparent;
            pointer-events: none;
        }
        .menu-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-section label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }
        input[type="text"], select {
            background: #0f172a;
            border: 1px solid #475569;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #38bdf8;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #7dd3fc;
        }
        .btn-secondary {
            background: #475569;
            color: #f8fafc;
        }
        .btn-secondary:hover {
            background: #64748b;
        }
        /* Нижняя панель */
        .bottom-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(8px);
        }
        .tool-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }
        .tool-btn:hover {
            color: #fff;
            background: #334155;
        }
        .tool-btn.active {
            color: #fff;
            background: #0284c7;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .divider {
            width: 1px;
            height: 30px;
            background: #334155;
        }
        /* Индикатор режима */
        #mode-indicator {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(2, 132, 199, 0.9);
            color: white;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Контейнер для графа -->
    <div id="network-container"></div>

    <!-- Верхняя обертка меню -->
    <div class="top-menu-wrapper">
        <button class="toggle-menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i> <span id="toggle-text">Скрыть меню</span>
        </button>
        
        <div class="top-menu" id="topMenu">
            <!-- Секция добавления сущностей -->
            <div class="menu-section">
                <input type="text" id="nodeLabel" placeholder="Значение (например, +799...)">
                <select id="nodeType">
                    <option value="person">👤 Персона</option>
                    <option value="email">✉️ Email</option>
                    <option value="phone">📞 Телефон</option>
                    <option value="domain">🌐 Домен / IP</option>
                </select>
                <button class="btn" onclick="addCustomNode()">
                    <i class="fa-solid fa-plus"></i> Добавить
                </button>
            </div>

            <!-- Секция экспорта -->
            <div class="menu-section" style="gap: 8px;">
                <button class="btn btn-secondary" onclick="exportAsPNG()">
                    <i class="fa-solid fa-image"></i> Экспорт в Фото
                </button>
                <button class="btn btn-secondary" onclick="exportAsJSON()">
                    <i class="fa-solid fa-file-code"></i> Экспорт JSON
                </button>
            </div>
        </div>
    </div>

    <!-- Индикатор текущего режима работы -->
    <div id="mode-indicator">РЕЖИМ СОЕДИНЕНИЯ: Кликните по двум узлам последовательно</div>

    <!-- Нижняя панель инструментов -->
    <div class="bottom-panel">
        <button class="tool-btn" id="connectTool" onclick="toggleConnectMode()" title="Режим соединения (Связать элементы)">
            <i class="fa-solid fa-link"></i>
        </button>
        <div class="divider"></div>
        <button class="tool-btn" onclick="clearNetwork()" title="Очистить весь холст" style="color: #ef4444;">
            <i class="fa-solid fa-trash-can"></i>
        </button>
    </div>

    <script>
        // Инициализация данных графа (демо-данные на старте)
        let nodes = new vis.DataSet([
            { id: 1, label: 'даун', type: 'person', shape: 'icon', icon: { face: '"Font Awesome 6 Free"', code: '', size: 50, color: '#818cf8' } },
            { id: 2, label: 'user@gmail.com', type: 'email', shape: 'icon', icon: { face: '"Font Awesome 6 Free"', code: '', size: 50, color: '#fbbf24' } },
            { id: 3, label: '+79999999999', type: 'phone', shape: 'icon', icon: { face: '"Font Awesome 6 Free"', code: '', size: 50, color: '#34d399' } },
            { id: 4, label: 'domen.com', type: 'domain', shape: 'icon', icon: { face: '"Font Awesome 6 Free"', code: '', size: 50, color: '#38bdf8' } }
        ]);

        let edges = new vis.DataSet([
            { id: 'e1', from: 2, to: 1, arrows: 'to', color: { color: '#38bdf8', highlight: '#7dd3fc' }, width: 2 },
            { id: 'e2', from: 4, to: 1, arrows: 'to', color: { color: '#38bdf8', highlight: '#7dd3fc' }, width: 2 },
            { id: 'e3', from: 3, to: 1, arrows: 'to', color: { color: '#38bdf8', highlight: '#7dd3fc' }, width: 2 }
        ]);

        const container = document.getElementById('network-container');
        const data = { nodes: nodes, edges: edges };
        
        // Настройки отображения сети
        const options = {
            physics: {
                enabled: true,
                barnesHut: {
                    gravitationalConstant: -2000,
                    centralGravity: 0.3,
                    springLength: 150,
                    springConstant: 0.04
                },
                stabilization: { iterations: 150 }
            },
            nodes: {
                font: { color: '#ffffff', size: 14, background: '#0b0f19', padding: 4 },
                margin: 10
            },
            edges: {
                smooth: { type: 'cubicBezier', roundness: 0.4 }
            },
            interaction: {
                multiselect: false,
                dragNodes: true,
                dragView: true,
                zoomView: true
            }
        };

        // Создание графа
        const network = new vis.Network(container, data, options);

        // Логика переключения режимов
        let isConnectMode = false;
        let selectedFirstNode = null;

        function toggleConnectMode() {
            isConnectMode = !isConnectMode;
            const btn = document.getElementById('connectTool');
            const indicator = document.getElementById('mode-indicator');
            
            if (isConnectMode) {
                btn.classList.add('active');
                indicator.style.display = 'block';
                network.unselectAll();
                selectedFirstNode = null;
            } else {
                btn.classList.remove('active');
                indicator.style.display = 'none';
                selectedFirstNode = null;
            }
        }

        // Обработка кликов по графу
        network.on("click", function(params) {
            if (!isConnectMode) return;

            if (params.nodes.length > 0) {
                const clickedNodeId = params.nodes[0];

                if (selectedFirstNode === null) {
                    // Шаг 1: Выбран первый узел для связи
                    selectedFirstNode = clickedNodeId;
                    network.selectNodes([selectedFirstNode]);
                } else {
                    // Шаг 2: Выбран второй узел — создаем стрелку
                    if (selectedFirstNode !== clickedNodeId) {
                        // Проверяем, существует ли уже такая связь
                        const edgeExists = edges.get({
                            filter: function (item) {
                                return item.from === selectedFirstNode && item.to === clickedNodeId;
                            }
                        }).length > 0;

                        if (!edgeExists) {
                            edges.add({
                                from: selectedFirstNode,
                                to: clickedNodeId,
                                arrows: 'to',
                                color: { color: '#38bdf8', highlight: '#7dd3fc' },
                                width: 2
                            });
                        }
                    }
                    // Сбрасываем выделение и выходим из режима соединения
                    toggleConnectMode();
                }
            } else {
                // Если кликнули по пустому месту в режиме соединения — сбрасываем первый выбранный узел
                selectedFirstNode = null;
                network.unselectAll();
            }
        });

        // Функция сворачивания/разворачивания верхнего меню
        function toggleMenu() {
            const menu = document.getElementById('topMenu');
            const txt = document.getElementById('toggle-text');
            menu.classList.toggle('hidden');
            if(menu.classList.contains('hidden')) {
                txt.innerText = "Открыть меню";
            } else {
                txt.innerText = "Скрыть меню";
            }
        }

        // Словарь параметров для иконок OSINT сущностей
        const iconConfig = {
            person: { code: '', color: '#818cf8' },
            email: { code: '', color: '#fbbf24' },
            phone: { code: '', color: '#34d399' },
            domain: { code: '', color: '#38bdf8' }
        };

        // Добавление кастомного узла из формы меню
        function addCustomNode() {
            const labelInput = document.getElementById('nodeLabel');
            const typeSelect = document.getElementById('nodeType');
            
            const label = labelInput.value.trim();
            if (!label) {
                alert('Пожалуйста, введите значение для узла!');
                return;
            }

            const type = typeSelect.value;
            const config = iconConfig[type];
            const newId = Date.now();

            nodes.add({
                id: newId,
                label: label,
                type: type,
                shape: 'icon',
                icon: {
                    face: '"Font Awesome 6 Free"',
                    code: config.code,
                    size: 50,
                    color: config.color
                }
            });

            labelInput.value = ''; // Очистка ввода
        }

        // Полная очистка рабочей области
        function clearNetwork() {
            if(confirm('Вы уверены, что хотите полностью очистить текущий граф?')) {
                nodes.clear();
                edges.clear();
            }
        }

        // Экспорт структуры графа в JSON-файл
        function exportAsJSON() {
            const nodesData = nodes.get();
            const edgesData = edges.get();
            const graphData = { nodes: nodesData, edges: edgesData };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(graphData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "osint_graph_data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.removeChild(downloadAnchor);
        }

        // Экспорт визуального состояния холста в PNG-изображение
        function exportAsPNG() {
            // Принудительно рендерим кадр перед снимком холста
            network.redraw();
            
            const canvas = container.getElementsByTagName('canvas')[0];
            if (!canvas) {
                alert('Ошибка при генерации изображения холста.');
                return;
            }
            
            // Создаем временный виртуальный Canvas, чтобы объединить фоновую темную тему и сам граф
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const ctx = exportCanvas.getContext('2d');
            
            // Заливаем фон оригинальным цветом приложения
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            
            // Накладываем сверху граф, отрисованный vis.js
            ctx.drawImage(canvas, 0, 0);
            
            // Скачиваем готовый файл изображения
            const imageURL = exportCanvas.toDataURL("image/png");
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", imageURL);
            downloadAnchor.setAttribute("download", "osint_graph_capture.png");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.removeChild(downloadAnchor);
        }
    </script>
</body>
</html>
